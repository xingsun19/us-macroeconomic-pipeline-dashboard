[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-macro-pipeline"
version = "1.0.0"
description = "An auditable FRED to SQLite pipeline with Airflow, EDA, and Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pandas>=2.2.3,<3", "requests>=2.32.3,<3", "python-dotenv>=1.0.1,<2"]

[project.optional-dependencies]
dashboard = ["streamlit==1.49.1", "plotly==6.3.0"]
analysis = ["matplotlib==3.10.6", "nbformat==5.10.4", "nbconvert==7.16.6", "ipykernel==6.30.1", "jupyterlab==4.4.7"]
test = ["pytest==8.4.2", "pytest-cov==6.3.0", "responses==0.25.8"]

[project.scripts]
macro-pipeline = "macro_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["airflow: tests that require the Airflow container", "live: tests that require a real FRED API key"]
