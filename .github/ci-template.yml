name: Test and reproduce
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python scripts/scan_secrets.py
      - run: pytest -m 'not airflow and not live' --cov=macro_pipeline --cov-report=term-missing --junitxml=reports/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: reports/test-results.xml
  airflow-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/airflow.Dockerfile -t macro-airflow-ci .
      - run: docker run --rm -e AIRFLOW__CORE__LOAD_EXAMPLES=false --entrypoint pytest macro-airflow-ci /opt/project/tests/test_dag.py -q
